[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dlrverify"
version = "0.9.0"
description = "Reproduction code for 'From Predictive Distributions to Operational Line Ratings' (MDPI Forecasting review)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Julian L. Cardenas-Barrera"}]
dependencies = ["numpy", "pandas", "scipy", "statsmodels", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
